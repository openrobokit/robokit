retargeting:
  type: position
  urdf_path: paxini_hand/dexh13_hand_right_description.urdf

  target_joint_names: ["right_thumb_joint_0",
   "right_thumb_joint_1",
   "right_thumb_joint_2",
   "right_thumb_joint_3",
   "right_index_joint_0",
   "right_index_joint_1",
   "right_index_joint_2",
   "right_index_joint_3",
   "right_middle_joint_0",
   "right_middle_joint_1",
   "right_middle_joint_2",
   "right_middle_joint_3",
   "right_ring_joint_0",
   "right_ring_joint_1",
   "right_ring_joint_2",
   "right_ring_joint_3"]
  target_link_names: [ "thumb_tip", "index_tip", "middle_tip", "ring_tip",
                       "right_thumb_link_1", "right_index_link_1", "right_middle_link_1", "right_ring_link_1" ]

  target_link_human_indices: [ 4, 8, 12, 16, 2, 6, 10, 14 ]
  add_dummy_free_joint: True

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  # 1 means no filter while 0 means not moving
  low_pass_alpha: 1
